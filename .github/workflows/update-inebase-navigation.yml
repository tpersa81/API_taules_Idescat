name: Update INEbase navigation

on:
  push:
    paths:
      - ".github/workflows/update-inebase-navigation.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build INEbase navigation catalog
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python scripts/build_inebase_navigation.py
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inebase-navigation.json
          git diff --cached --quiet || git commit -m "Update INEbase navigation catalog"
          git push
