name: Update Eurostat catalogue

on:
  push:
    paths:
      - ".github/workflows/update-eurostat-toc.yml"
      - "scripts/update-eurostat-toc.py"
  schedule:
    - cron: "15 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and build Eurostat TOC
        run: python scripts/update-eurostat-toc.py
      - name: Commit catalogue when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eurostat-toc.json
          if git diff --cached --quiet; then
            echo "Eurostat catalogue unchanged"
          else
            git commit -m "Update Eurostat catalogue"
            git push
          fi
